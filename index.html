<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BAT-TRANSLATOR | RU → DE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bat-yellow: #f5c518;
    --bat-dark: #0a0a0a;
    --bat-gray: #1a1a2e;
    --bat-mid: #16213e;
    --bat-blue: #0f3460;
    --bat-glow: #f5c51855;
    --bat-text: #e0e0e0;
    --neon-yellow: #ffe600;
  }

  body {
    background: var(--bat-dark);
    color: var(--bat-text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 50%, #1a1a2e44 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, #0f346033 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, #f5c51808 0%, transparent 40%);
    z-index: -1;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* ── Batman SVG Logo ── */
  .bat-logo {
    display: flex;
    justify-content: center;
    margin: 24px auto 0;
    filter: drop-shadow(0 0 25px var(--bat-yellow)) drop-shadow(0 0 50px #f5c51844);
    animation: batFloat 3s ease-in-out infinite;
  }

  .bat-logo svg { width: 120px; height: auto; fill: var(--bat-yellow); }

  @keyframes batFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ── Header ── */
  .header { text-align: center; padding: 8px 20px 16px; }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 5vw, 2.6rem);
    background: linear-gradient(135deg, var(--bat-yellow), #fff176, var(--neon-yellow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: titleGlow 2s ease-in-out infinite alternate;
  }

  @keyframes titleGlow {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.3); }
  }

  .header .subtitle {
    font-size: 1rem;
    color: #666;
    margin-top: 2px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  /* ── Container ── */
  .container { max-width: 700px; margin: 0 auto; padding: 0 16px 40px; }

  /* ── Gender legend ── */
  .gender-legend {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .legend-chip {
    padding: 5px 12px;
    border-radius: 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1px;
    border: 1px solid;
  }

  .legend-chip.m { background: #1b5e2011; border-color: #4caf50; color: #4caf50; }
  .legend-chip.f { background: #e91e6311; border-color: #e91e63; color: #e91e63; }
  .legend-chip.n { background: #2196f311; border-color: #2196f3; color: #2196f3; }

  /* ── Input ── */
  .input-section { position: relative; margin-bottom: 16px; }

  .input-wrapper {
    position: relative;
    border: 2px solid #333;
    border-radius: 16px;
    background: linear-gradient(145deg, #111, #1a1a2e);
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-wrapper:focus-within {
    border-color: var(--bat-yellow);
    box-shadow: 0 0 20px var(--bat-glow), 0 0 40px #f5c51822;
  }

  .input-wrapper textarea {
    width: 100%;
    padding: 16px;
    padding-right: 64px;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    resize: none;
    outline: none;
    min-height: 64px;
  }

  .input-wrapper textarea::placeholder { color: #555; font-weight: 400; }

  .send-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--bat-yellow);
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    color: var(--bat-yellow);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    -webkit-appearance: none;
  }

  .send-btn:hover, .send-btn:active {
    background: var(--bat-yellow);
    color: #000;
    box-shadow: 0 0 20px var(--bat-glow);
  }

  /* ── Quick chips ── */
  .quick-section { margin-bottom: 16px; }

  .quick-section .label {
    font-size: 0.7rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }

  .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .quick-chip {
    padding: 7px 14px;
    border-radius: 20px;
    background: #1a1a2e;
    border: 1px solid #333;
    color: #aaa;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
  }

  .quick-chip:hover, .quick-chip:active {
    border-color: var(--bat-yellow);
    color: var(--bat-yellow);
    background: #f5c51811;
  }

  /* ── Results ── */
  .results { display: flex; flex-direction: column; gap: 10px; }

  .result-card {
    background: linear-gradient(145deg, #111118, #1a1a2e);
    border: 1px solid #2a2a3e;
    border-radius: 14px;
    padding: 14px 16px;
    transition: all 0.3s;
    animation: cardIn 0.4s ease-out backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-card .source {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .result-card .translation { font-size: 1.3rem; font-weight: 700; color: #fff; }

  .result-card .meta { font-size: 0.85rem; margin-top: 3px; color: #888; }

  .result-card .article { font-weight: 900; font-size: 1.4rem; margin-right: 4px; }

  .result-card.maskulin .article { color: #4caf50; }
  .result-card.feminin .article  { color: #e91e63; }
  .result-card.neutrum .article  { color: #2196f3; }

  .result-card .gender-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .result-card.maskulin .gender-badge { background: #1b5e2033; color: #4caf50; border: 1px solid #4caf5055; }
  .result-card.feminin .gender-badge  { background: #e91e6322; color: #e91e63; border: 1px solid #e91e6355; }
  .result-card.neutrum .gender-badge  { background: #2196f322; color: #2196f3; border: 1px solid #2196f355; }

  .result-card.non-noun .translation { color: var(--bat-yellow); }

  .result-card.non-noun .pos-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: #f5c51815;
    color: var(--bat-yellow);
    border: 1px solid #f5c51833;
    margin-left: 6px;
    vertical-align: middle;
  }

  .result-card.unknown { border-color: #ff5722; border-style: dashed; }
  .result-card.unknown .translation { color: #ff8a65; }

  .plural-info { color: #666; font-size: 0.8rem; font-style: italic; }

  .empty-state { text-align: center; padding: 36px 20px; color: #444; }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
  .empty-state p { font-size: 0.95rem; letter-spacing: 2px; }

  /* ── Tabs for dictionary browse ── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }

  .tab-btn {
    padding: 6px 14px;
    border-radius: 20px;
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    -webkit-appearance: none;
  }

  .tab-btn.active, .tab-btn:active {
    border-color: var(--bat-yellow);
    color: var(--bat-yellow);
    background: #f5c51811;
  }

  .dict-grid {
    display: none;
    flex-direction: column;
    gap: 6px;
    max-height: 50vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .dict-grid.visible { display: flex; }

  .dict-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #111118;
    border-radius: 10px;
    border: 1px solid #1e1e2e;
    cursor: pointer;
    transition: all 0.2s;
  }

  .dict-row:active { border-color: var(--bat-yellow); background: #f5c51808; }

  .dict-row .ru { color: #aaa; font-size: 1rem; font-weight: 600; }
  .dict-row .de { font-size: 1rem; font-weight: 700; }
  .dict-row .de.maskulin { color: #4caf50; }
  .dict-row .de.feminin  { color: #e91e63; }
  .dict-row .de.neutrum  { color: #2196f3; }
  .dict-row .de.other    { color: var(--bat-yellow); }

  .section-divider {
    text-align: center;
    padding: 16px 0 8px;
    color: #444;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 4px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>

      <span class="quick-chip" onclick="quickTranslate('хлеб молоко сыр')">&#127838; еда</span>

      <span class="quick-chip" onclick="quickTranslate('до свидания')">&#128075; пока</span>
    </div>
  </div>

  <div id="results" class="results">
    <div class="empty-state">
      <div class="icon">&#129415;</div>
      <p>The Dark Knight awaits your words...</p>
    </div>
  </div>

  <div class="section-divider" style="margin-top:24px;">Browse Dictionary</div>

  <div class="tabs" id="tabs">

    <button class="tab-btn" onclick="showTab('pronoun')">Pron.</button>
    <button class="tab-btn" onclick="showTab('other')">Other</button>
  </div>

  <div class="dict-grid visible" id="dictGrid"></div>
</div>

const ARTICLES = { maskulin: "der", feminin: "die", neutrum: "das" };

function translateText(text) {
  const words = text.trim().split(/\s+/);
  const results = [];
  let i = 0;
  while (i < words.length) {
    if (i + 1 < words.length) {
      const phrase = (words[i] + " " + words[i+1]).toLowerCase();
      if (DICT[phrase]) {
        results.push({ source: words[i] + " " + words[i+1], entry: DICT[phrase] });
        i += 2;
        continue;
      }
    }
    const w = words[i].toLowerCase();
    results.push({ source: words[i], entry: DICT[w] || null });
    i++;
  }
  return results;
}

function quickTranslate(text) {
  document.getElementById('inputText').value = text;
  doTranslate();
}

function doTranslate() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) return;

  const results = translateText(input);
  const container = document.getElementById('results');

  if (results.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>Nothing to translate</p></div>';
    return;
  }

  let html = '';
  results.forEach((item, i) => {
    const style = `animation-delay: ${i * 0.08}s`;
    const e = item.entry;

    if (!e) {
      html += `<div class="result-card unknown" style="${style}">
        <div class="source">${item.source}</div>
        <div class="translation">Not in dictionary</div>
      </div>`;
    } else if (e.p === 'noun') {
      const article = ARTICLES[e.g];
      const plural = e.pl ? `<span class="plural-info">Pl. ${e.pl}</span>` : '';
      html += `<div class="result-card ${e.g}" style="${style}">
        <div class="source">${item.source}</div>
        <div class="translation">
          <span class="article">${article}</span>${e.t}
          <span class="gender-badge">${e.g}</span>
        </div>
        <div class="meta">${plural}</div>
      </div>`;
    } else {
      html += `<div class="result-card non-noun" style="${style}">
        <div class="source">${item.source}</div>
        <div class="translation">
          ${e.t}
          <span class="pos-tag">${e.p}</span>
        </div>
      </div>`;
    }
  });

  container.innerHTML = html;
}

// ── Dictionary browser ──
let currentTab = 'all';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderDict();
}

function renderDict() {
  const grid = document.getElementById('dictGrid');
  const otherTypes = ['preposition','conjunction','numeral','particle'];
  let html = '';

  const entries = Object.entries(DICT).filter(([k, v]) => {
    if (currentTab === 'all') return true;
    if (currentTab === 'other') return otherTypes.includes(v.p);
    return v.p === currentTab;
  });

  entries.forEach(([ru, e]) => {
    let deClass = 'other';
    let deText = e.t;
    if (e.p === 'noun') {
      deClass = e.g;
      deText = `${ARTICLES[e.g]} ${e.t}`;
    }
    html += `<div class="dict-row" onclick="quickTranslate('${ru}')">
      <span class="ru">${ru}</span>
      <span class="de ${deClass}">${deText}</span>
    </div>`;
  });

  grid.innerHTML = html;
  grid.classList.add('visible');
}

renderDict();
